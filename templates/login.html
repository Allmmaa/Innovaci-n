<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
<div class="cuadrado">

    <h2>InnovaSoft</h2>
    <h1>Iniciar sesión</h1>
    <p>Ingresá con tus credenciales de InnovaSoft</p>
    <hr>

    {% if error %}
        <p style="color: red; text-align: center; font-size: 0.9rem;">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">

        <input 
            type="email" 
            name="email" 
            placeholder="Correo electrónico" 
            required
        >

        <input 
            type="password" 
            name="password" 
            placeholder="Contraseña" 
            required
        >

        <button type="submit">Ingresar</button>


    </form>
</div>
</body>
</html>
