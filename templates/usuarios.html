
<section class="header-section">
    <h2>Usuarios registrados</h2>
    <input type="text" placeholder="Buscar por usuario o email...">
</section>

<table>
    <thead>
        <tr>
            <th>Usuario</th>
            <th>Correo electrónico</th>
            <th>Aplicaciones</th>
        </tr>
    </thead>

    <tbody>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.email }}</td>
            <td>{{ usuario.aplicacion }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
